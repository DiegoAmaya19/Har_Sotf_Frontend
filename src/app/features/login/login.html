<section class="mx-auto w-full min-w-0 max-w-md px-4 py-8 sm:px-6">
    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
      <header class="mb-7 text-center">
        <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Iniciar sesión</h1>
        <p class="mt-2 text-sm text-slate-600">Ingresa tus credenciales para acceder a tu cuenta.</p>
      </header>
  
      <!-- <form
        class="space-y-5"
       // [formGroup]="loginForm"
       // (ngSubmit)="onLogin()"
        aria-label="Formulario de inicio de sesión"
      > -->
        <div class="space-y-1.5">
          <label for="username" class="block text-sm font-medium text-slate-700">Usuario</label>
          <input
            id="username"
            type="text"
            formControlName="username"
            required
            placeholder="Ej. usuario123"
            class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 shadow-sm outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"
          />
        </div>
  
        <div class="space-y-1.5">
          <label for="password" class="block text-sm font-medium text-slate-700">Contraseña</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            required
            placeholder="********"
            class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 shadow-sm outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"
          />
        </div>
  
        <div class="flex justify-between items-center">
          <div class="flex items-center">
            <input
              id="rememberMe"
              type="checkbox"
              formControlName="rememberMe"
              class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500"
            />
            <label for="rememberMe" class="ml-2 block text-sm text-slate-700">Recuérdame</label>
          </div>
          <a
            routerLink="switchpassword"
            class=" cursor-pointer text-sm font-medium text-indigo-600 hover:underline "
            aria-label="¿Olvidaste tu contraseña?"
          >
            ¿Olvidaste tu contraseña?
          </a>
        </div>
  
        <div class="flex justify-end">
          <!-- <button
            type="submit"
         //   [disabled]="loginForm.invalid || isSubmitting()"
            class="inline-flex min-h-11 items-center justify-center rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700 active:scale-[0.98] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-600 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:bg-slate-300 disabled:shadow-none disabled:active:scale-100"
            aria-label="Iniciar sesión"
          > -->
            <span *ngIf="isSubmitting; else defaultText">Iniciando...</span>
            <ng-template #defaultText>Iniciar sesión</ng-template>
          <!-- </button> -->
        </div>
      <!-- </form> -->
    </div>
  </section>

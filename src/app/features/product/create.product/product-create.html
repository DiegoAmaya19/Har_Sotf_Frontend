<section class="mx-auto max-w-2xl px-4 py-8 sm:px-6">
    <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
        <header class="mb-7">
            <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Crear producto</h1>
            <p class="mt-2 text-sm text-slate-600">Completa los datos para registrar un nuevo producto.</p>
        </header>

        <form class="space-y-5" [formGroup]="form" (ngSubmit)="onSubmit()">

            <div class="grid gap-5 sm:grid-cols-2">
                <div class="space-y-1.5">
                    <label for="reference" class="block text-sm font-medium text-slate-700">Referencia</label>
                    <input id="reference" type="text" formControlName="reference" required placeholder="Ej. PROD-001"
                        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 shadow-sm outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" />
                </div>
            </div>

            <div class="space-y-1.5">
                <label for="nameProduct" class="block text-sm font-medium text-slate-700">Nombre del producto</label>
                <input id="nameProduct" type="text" formControlName="nameProduct" required
                    placeholder="Ej. Teclado inalámbrico"
                    class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 shadow-sm outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" />
            </div>

            <div class="space-y-1.5">
                <label for="categoryProduct" class="block text-sm font-medium text-slate-700">Categoría</label>
                <input id="categoryProduct" type="number" formControlName="categoryProduct" required
                    placeholder="Ej. 1"
                    class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 shadow-sm outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" />
            </div>

            <div class="space-y-1.5">
                <label for="description" class="block text-sm font-medium text-slate-700">Descripción</label>
                <textarea id="description" formControlName="description" required rows="4"
                    placeholder="Describe brevemente el producto"
                    class="w-full resize-y rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 shadow-sm outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"></textarea>
            </div>

            <div class="grid gap-5 sm:grid-cols-2">
                <div class="space-y-1.5">
                    <label for="price" class="block text-sm font-medium text-slate-700">Precio</label>
                    <input id="price" type="number" formControlName="price" min="0" step="0.01" required
                        placeholder="0.00"
                        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 shadow-sm outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" />
                </div>

                <div class="space-y-1.5">
                    <label for="stock" class="block text-sm font-medium text-slate-700">Stock</label>
                    <input id="stock" type="number" formControlName="stock" min="0" step="1" required placeholder="0"
                        class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 shadow-sm outline-none transition placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20" />
                </div>
            </div>

            <div class="flex justify-end border-t border-slate-100 pt-5">
                <button type="submit" [disabled]="form.invalid || isSubmitting()"
                    class="inline-flex min-h-11 items-center justify-center rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700 active:scale-[0.98] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-600 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:bg-slate-300 disabled:shadow-none disabled:active:scale-100">
                    @if (isSubmitting()) {
                    Guardando...
                    } @else {
                    Crear producto
                    }
                </button>
            </div>
        </form>
    </div>
</section>

<section class="mx-auto w-full min-w-0 max-w-5xl px-4 py-8 sm:px-6">
  @if (loadError()) {
    <p role="alert" class="mb-4 rounded-lg border border-rose-200 bg-rose-50 p-3 text-sm text-rose-900">
      {{ loadError() }}
    </p>
  }
  @if (notification(); as notice) {
    <p
      class="mb-4 rounded-lg border p-3 text-sm"
      [class.border-emerald-200]="notice.kind === 'success'"
      [class.bg-emerald-50]="notice.kind === 'success'"
      [class.text-emerald-900]="notice.kind === 'success'"
      [class.border-rose-200]="notice.kind === 'error'"
      [class.bg-rose-50]="notice.kind === 'error'"
      [class.text-rose-900]="notice.kind === 'error'"
      [attr.role]="notice.kind === 'success' ? 'status' : 'alert'"
      [attr.aria-live]="notice.kind === 'success' ? 'polite' : 'assertive'"
    >
      {{ notice.message }}
    </p>
  }

  <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
    <header class="mb-7">
      <h1 class="text-2xl font-semibold tracking-tight text-slate-900">Editar proveedor</h1>
      <p class="mt-2 text-sm text-slate-600">Actualiza los datos y guarda los cambios.</p>
    </header>

    <form class="grid gap-5 md:grid-cols-2" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="space-y-1.5">
        <label for="supplier-nit" class="block text-sm font-medium text-slate-700">NIT</label>
        <input
          id="supplier-nit"
          type="text"
          formControlName="nit"
          required
          class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 shadow-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"
        />
      </div>
      <div class="space-y-1.5">
        <label for="supplier-company" class="block text-sm font-medium text-slate-700">Empresa</label>
        <input
          id="supplier-company"
          type="text"
          formControlName="company"
          required
          class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 shadow-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"
        />
      </div>
      <div class="space-y-1.5">
        <label for="supplier-contact" class="block text-sm font-medium text-slate-700">Contacto</label>
        <input
          id="supplier-contact"
          type="text"
          formControlName="contact"
          required
          class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 shadow-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"
        />
      </div>
      <div class="space-y-1.5">
        <label for="supplier-phone" class="block text-sm font-medium text-slate-700">Teléfono de contacto</label>
        <input
          id="supplier-phone"
          type="tel"
          formControlName="phoneContact"
          required
          class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-sm text-slate-900 shadow-sm outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20"
        />
      </div>
      <div class="space-y-1.5 md:col-span-2">
        <label for="supplier-categories" class="block text-sm font-medium text-slate-700">
          Categorías de productos
        </label>
        <select
          id="supplier-categories"
          formControlName="idCategoryProduct"
          multiple
          required
          aria-describedby="supplier-categories-hint"
          class="min-h-32 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20"
        >
          @for (category of categories(); track category.idCategoryProduct) {
            <option [ngValue]="category.idCategoryProduct">{{ category.nameCategoryProduct }}</option>
          }
        </select>
        <p id="supplier-categories-hint" class="text-xs text-slate-500">
          Mantén Ctrl (Windows) o Command (Mac) para seleccionar varias categorías.
        </p>
      </div>
      <div class="flex justify-between border-t border-slate-100 pt-5 md:col-span-2">
        <a
          routerLink="/mainLayoutComponent/supplierMain/supplierRead"
          class="inline-flex min-h-11 items-center justify-center gap-2 rounded-lg border border-slate-300 bg-white px-5 py-2.5 text-sm font-semibold text-slate-700 shadow-sm transition hover:border-slate-400 hover:bg-slate-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-600 focus-visible:ring-offset-2"
        >
          <span aria-hidden="true">←</span>
          Cancelar
        </a>
        <button
          type="submit"
          [disabled]="form.invalid || isSubmitting()"
          class="inline-flex min-h-11 items-center justify-center rounded-lg bg-indigo-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-indigo-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-600 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:bg-slate-300"
        >
          {{ isSubmitting() ? 'Guardando...' : 'Actualizar proveedor' }}
        </button>
      </div>
    </form>
  </div>
</section>
